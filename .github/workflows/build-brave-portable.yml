name: Build Brave True Portable ZIP (Manual)

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Official stable Brave version (e.g. 1.97.59, without v)"
        required: true
        default: '1.97.59'
        type: string

permissions:
  contents: read

concurrency:
  group: brave-portable-manual
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout portable builder files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install icon converter
        run: python -m pip install "Pillow==11.3.0"

      - name: Test builder before downloading browser
        run: python -m unittest discover -s tests -v

      - name: Download, SHA-256-verify and stage official Brave stable release
        shell: pwsh
        env:
          BRAVE_VERSION: ${{ inputs.release_version }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python builder/build_portable.py --version "$env:BRAVE_VERSION" --root .
          if ($LASTEXITCODE -ne 0) { throw 'Brave build/download verification failed.' }

      - name: Compile launcher using original Brave icon
        shell: pwsh
        run: |
          & ./builder/compile_launcher.ps1 -StageRoot "stage/BravePortable"
          if ($LASTEXITCODE -ne 0) { throw 'Launcher build failed.' }

      - name: Create and verify ZIP package
        shell: pwsh
        env:
          BRAVE_VERSION: ${{ inputs.release_version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $dest = "artifacts/Brave-v$env:BRAVE_VERSION-TRUE-Portable.zip"
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          Compress-Archive -Path stage/BravePortable -DestinationPath $dest -CompressionLevel Optimal
          python builder/verify_zip.py $dest
          if ($LASTEXITCODE -ne 0) { throw 'Brave portable ZIP verification failed.' }

      - name: Upload downloadable ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: Brave-TruePortable-${{ inputs.release_version }}-x64
          path: artifacts/Brave-*.zip
          if-no-files-found: error
          retention-days: 7
